services:
  audioToText:
    container_name: audioToText
    image: omriwallach/koldavar:audio_to_text
    build: 
      dockerfile: ./docker/Dockerfile.audioToText
      context: ../
    
    ports:
      - "8080:8080"
  
  inputExtraction:
    container_name: inputExtraction
    image: omriwallach/koldavar:input_extraction
    build: 
      dockerfile: ./docker/Dockerfile.inputExtraction
      context: ../
    
    ports:
      - "8081:8081"

  syncManager:
    container_name: syncManager
    image: omriwallach/koldavar:sync_manager
    build: 
      dockerfile: ./docker/Dockerfile.syncManager
      context: ../
    
    ports:
      - "8082:8082"
  
  textSynthesizer:
    container_name: textSynthesizer
    image: omriwallach/koldavar:text_synthesizer
    build: 
      dockerfile: ./docker/Dockerfile.textSynthesizer
      context: ../
    
    ports:
      - "8083:8083"
  
