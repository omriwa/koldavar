{{- if .Values.services.inputExtraction.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.services.inputExtraction.name }}-service
spec:
  selector:
    app: {{ .Values.services.inputExtraction.name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.services.inputExtraction.port }}
      targetPort: {{ .Values.services.inputExtraction.port }}
{{- end }}