apiVersion: batch/v1
kind: Job
metadata:
  name: redpanda-create-topics
  namespace: {{ .Values.kafka.namespace }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: create-topics
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              echo "Waiting for Redpanda..."
              BROKERS="redpanda.{{ .Values.kafka.namespace }}.svc.cluster.local:{{ .Values.kafka.redpanda.port }}"

              for i in $(seq 1 60); do
                rpk cluster info --brokers "$BROKERS" >/dev/null 2>&1 && break
                echo "Still waiting... ($i/60)"
                sleep 2
              done

              echo "Creating topics..."
              {{- range .Values.kafka.topics }}
              rpk topic create {{ . | quote }} --brokers "$BROKERS" || true
              {{- end }}
              echo "Topics created."
