apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: {{ .Values.kafka.namespace }}
spec:
  serviceName: redpanda
  replicas: {{ .Values.kafka.redpanda.replicas }}
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "Fixing volume permissions..."
              mkdir -p /var/lib/redpanda/data
              chown -R 101:101 /var/lib/redpanda/data
              chmod -R 775 /var/lib/redpanda/data
              echo "Permissions fixed."
          volumeMounts:
            - name: redpanda-storage
              mountPath: /var/lib/redpanda/data

      containers:
        - name: redpanda
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          command: ["/entrypoint.sh"]
          args:
            - redpanda
            - start
            - --overprovisioned
            - --smp={{ .Values.kafka.redpanda.smp }}
            - --memory={{ .Values.kafka.redpanda.memory }}
            - --reserve-memory={{ .Values.kafka.redpanda.reserveMemory }}

            # LISTEN inside the pod on kafka.redpanda.port
            - --kafka-addr=PLAINTEXT://0.0.0.0:{{ .Values.kafka.redpanda.port }}

            # ADVERTISE for clients (internal or external depending on values)
            {{- if .Values.kafka.redpanda.nodePort }}
            - --advertise-kafka-addr=PLAINTEXT://192.168.49.2:{{ .Values.kafka.redpanda.nodePort }}
            {{- else }}
            - --advertise-kafka-addr=PLAINTEXT://{{ .Values.kafka.redpanda.advertisedKafkaAddr }}:{{ .Values.kafka.redpanda.port }}
            {{- end }}

            # PandaProxy (optional; keep if you use it)
            - --pandaproxy-addr=0.0.0.0:{{ .Values.kafka.redpanda.pandaproxyPort }}

          ports:
            - containerPort: {{ .Values.kafka.redpanda.port }}
              name: kafka
            - containerPort: 9644
              name: admin
            - containerPort: {{ .Values.kafka.redpanda.pandaproxyPort }}
              name: pandaproxy

          volumeMounts:
            - name: redpanda-storage
              mountPath: /var/lib/redpanda/data

      volumes:
        - name: redpanda-storage
          persistentVolumeClaim:
            claimName: redpanda-data
