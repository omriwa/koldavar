global:
  dockerHubSecret:
    name: dockerhub-secret
  
  security:
    allowInsecureImages: true

services:
  audioToText:
    name: audio-to-text
    enabled: true
    image: "omriwallach/koldavar:audio_to_text"
    pullPolicy: Always
    port: 8080
    replicas: 1

  inputExtraction:
    name: input-extraction
    enabled: true
    image: "omriwallach/koldavar:input_extraction"
    pullPolicy: Always
    port: 8081
    replicas: 1

  syncManager:
    name: sync-manager
    enabled: true
    image: "omriwallach/koldavar:sync_manager"
    pullPolicy: Always
    port: 8082
    replicas: 1

  textSynthesizer:
    name: text-synthesizer
    enabled: true
    image: "omriwallach/koldavar:text_synthesizer"
    pullPolicy: Always
    port: 8083
    replicas: 1
  
  tts:
    name: tts
    enabled: true
    image: "omriwallach/koldavar:text_synthesizer"
    pullPolicy: Always
    port: 8083
    replicas: 1

redis:
  name: redis
  enabled: true
  image: redis
  port: 8085
  targetPort: 6379

traefik:
  enabled: true
  providers:
    kubernetesCRD:
      enabled: true
    kubernetesIngress:
      enabled: false

ingressClass:
  name: traefik

kafka:
  name: koldavar-kafka
  namespace: kafka
  version: "4.1.1"
  storage: 10Gi
  
zookeeper:
  replicas: 3
  storage: 10Gi


entityOperator:
  enabled: true

topics:
  - name: audio.raw.extracted
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: text.synthesis.input
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: audio.synthesis.input
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: text.synthesis.output
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: audio.generated
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: dead-letter
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: pipeline-output
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days

  - name: task-status
    partitions: 3
    replicas: 3
    retentionMs: 604800000  # 7 days