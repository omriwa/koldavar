name: CI
on: [push]
jobs:
  go-compailer-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - inputExtraction
          - syncManager
          - textSynthesizer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build service ${{ matrix.service }}
        run: bash ./scripts/check_go_services.sh ${{ matrix.service }}
