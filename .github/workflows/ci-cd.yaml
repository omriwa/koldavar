name: CI-CD

on: [push]

jobs:
  go-compiler-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - inputExtraction
          - syncManager
          - textSynthesizer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build service ${{ matrix.service }}
        run: bash ./scripts/check_go_services.sh ${{ matrix.service }}

  python-compiler-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - audioToText
          # - tts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build service ${{ matrix.service }}
        run: bash ./scripts/check_python_services.sh ${{ matrix.service }}

  compiler-checks:
    runs-on: ubuntu-latest
    needs:
      - go-compiler-check
      - python-compiler-check
    steps:
      - run: echo "All compiler checks passed"
        
  docker-images:
    runs-on: ubuntu-latest
    needs:
      - compiler-checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Debug location
        run: |
          echo "PWD:"
          pwd
          echo "List:"
          ls -la

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push with Docker Compose
        env:
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
        run: |
          cd docker
          docker buildx bake --allow=fs.read=.. -f docker-compose.yaml --push

  setup-on-remote:
    runs-on: ubuntu-latest
    needs:
      - docker-images
    
    steps:
      - name: k8s-setup
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }} 
        run: |
          echo "${{ secrets.REMOTE_PRIVATE_KEY }}" > key
          chmod 600 key
          echo "Trying to connect..."
          ssh root@${{ secrets.REMOTE_ADDRESS }} -i key -o StrictHostKeyChecking=no "echo 'SSH connection OK. Server hostname:' && hostname"
          
          GIT_SSH_COMMAND="ssh -i ~/.ssh/github/git_deploy -o IdentitiesOnly=yes"   git clone git@github.com:omriwa/koldavar.git && echo "cloned repo"
          cd koldavar && git checkout remotes/origin/${BRANCH_NAME} && kubectl apply -k ./k8s/base
          echo "k8s finished"

          


