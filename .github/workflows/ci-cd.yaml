name: CI

on: push

jobs:
  go-compailer-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - inputExtraction
          - syncManager
          - textSynthesizer

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Build service ${{ matrix.service }}
        run: bash ./scripts/check_go_services.sh ${{ matrix.service }}

  python-compailer-check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - audioToText
          # - tts

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build service ${{ matrix.service }}
        run: bash ./scripts/check_python_services.sh ${{ matrix.service }}

  all-checks:
    runs-on: ubuntu-latest
    needs:
      - go-compailer-check
      - python-compailer-check
    steps:
      - run: echo "All checks passed"
        
  docker-images:
    runs-on: ubuntu-latest
    if: ${{ github.event.all-checks.conclusion == 'success' }}

    steps:
      - name: Debug event payload
        run: |
          echo "Workflow Run Name: ${{ github.event.workflow_run.name }}"
          echo "Workflow Run Conclusion: ${{ github.event.workflow_run.conclusion }}"
          echo "Workflow Run Branch: ${{ github.event.workflow_run.head_branch }}"

      - name: Checkout code for EXACT commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push with Docker Compose
        run: |
          docker compose -f ./docker/docker-compose.yml build
          docker compose -f ./docker/docker-compose.yml push

